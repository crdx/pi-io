name: Build

on:
  push:
    branches: [dev]
    tags:
      - 'v*-crdx.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: just build

      - name: Compute tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          fi

      - name: Write build info
        run: |
          cat > packages/coding-agent/meta.json <<EOF
          {
            "tag": "${{ steps.tag.outputs.name }}",
            "sha": "${{ github.sha }}",
            "date": "$(date -u +'%d %b %Y')",
            "buildDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "node": "$(node --version)",
            "commitUrl": "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          }
          EOF

      - name: Assemble standalone tarball
        run: |
          # npm workspaces resolve sibling deps as symlinks, but npm pack
          # skips symlinks, so bundleDependencies stays empty if we pack from
          # inside the workspace. Stage the package outside the monorepo,
          # install the sibling tarballs there, then pack the staged copy.
          rm -rf /tmp/pi-release /tmp/pi-siblings /tmp/pi-stage
          mkdir -p /tmp/pi-release /tmp/pi-siblings /tmp/pi-stage

          for dir in agent ai tui; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/pi-siblings)
          done

          (cd packages/coding-agent && npm pack --pack-destination /tmp/pi-stage)
          tar xzf /tmp/pi-stage/mariozechner-pi-coding-agent-*.tgz -C /tmp/pi-stage --strip-components=1

          cd /tmp/pi-stage
          npm install --no-save /tmp/pi-siblings/*.tgz
          npm pack --pack-destination /tmp/pi-release

          mv /tmp/pi-release/mariozechner-pi-coding-agent-*.tgz /tmp/pi-release/pi.tgz

      - name: Extract changelog
        if: github.ref_type == 'tag'
        id: changelog
        run: |
          BODY=$(just release::notes "${{ github.ref_name }}")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: /tmp/pi-release/pi.tgz

      - name: Create dev tag and release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEV_TAG="${{ steps.tag.outputs.name }}"
          git tag "$DEV_TAG" "${{ github.sha }}"
          git push origin "refs/tags/$DEV_TAG"
          gh release create "$DEV_TAG" /tmp/pi-release/pi.tgz \
            --title "$DEV_TAG" \
            --notes "Development build from ${{ github.sha }}" \
            --prerelease

      - name: Prune old dev releases
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName --jq '.[].tagName' \
            | grep '^dev-' \
            | sort -r \
            | tail -n +4 \
            | while read -r TAG; do
                gh release delete "$TAG" --yes --cleanup-tag
              done
