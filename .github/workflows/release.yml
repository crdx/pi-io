# Built tarball is consumed by env/pi/bin/install in https://github.com/crdx/system.
# See that repo's AGENTS.md for the full picture.

name: Release

on:
  push:
    tags:
      - 'v*-crdx.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: just build

      - name: Write build info
        run: |
          echo '{"tag":"${{ github.ref_name }}","date":"'"$(date -u +'%d %b %Y')"'"}' \
            > packages/coding-agent/meta.json

      - name: Assemble standalone tarball
        run: |
          # npm workspaces resolve sibling deps as symlinks, but npm pack
          # skips symlinks, so bundleDependencies stays empty if we pack from
          # inside the workspace. Stage the package outside the monorepo,
          # install the sibling tarballs there, then pack the staged copy.
          rm -rf /tmp/pi-release /tmp/pi-siblings /tmp/pi-stage
          mkdir -p /tmp/pi-release /tmp/pi-siblings /tmp/pi-stage

          for dir in agent ai tui; do
            (cd "packages/$dir" && npm pack --pack-destination /tmp/pi-siblings)
          done

          (cd packages/coding-agent && npm pack --pack-destination /tmp/pi-stage)
          tar xzf /tmp/pi-stage/mariozechner-pi-coding-agent-*.tgz -C /tmp/pi-stage --strip-components=1

          cd /tmp/pi-stage
          npm install --no-save /tmp/pi-siblings/*.tgz
          npm pack --pack-destination /tmp/pi-release

      - name: Create release with tarball
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: /tmp/pi-release/mariozechner-pi-coding-agent-*.tgz
